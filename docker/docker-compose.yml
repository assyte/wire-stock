# NOT: MinIO Şubat 2026'da Docker Hub'daki kendi image'ını kaldırdı.
# Resmi olarak artık "alpine/minio" kullanılıyor (Alpine Linux tabanlı).
# "version" key'i Docker Compose v2+'de obsolete, kaldırıldı.

services:
  # ============================================
  # PostgreSQL - Ana Veritabanı
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: wirestock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wirestock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wirestock}
      POSTGRES_DB: ${POSTGRES_DB:-wirestock}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wirestock}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wirestock-net

  # ============================================
  # Redis - Cache & Queue
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: wirestock-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wirestock-net

  # ============================================
  # MinIO - Dosya Depolama (S3 uyumlu)
  # ============================================
  minio:
    # MinIO kendi Docker Hub reposunu kapattı (2026 Şubat). Yeni resmi image: alpine/minio
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: wirestock-minio
    restart: unless-stopped
    # alpine/minio varsayılan UID 1001 ile çalışıyor, mount edilen volume'a erişemiyor.
    # Bu yüzden root olarak çalıştırıyoruz (dev ortamı).
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-wirestock}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-wirestock-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # alpine/minio busybox tabanlı, bash/curl yok. wget ile HTTP testi.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - wirestock-net

  # ============================================
  # MailHog - Geliştirme için e-posta (opsiyonel)
  # ============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: wirestock-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - wirestock-net

  # ============================================
  # minio-init - Wirestock bucket'ını otomatik oluşturur
  # minio/mc ve minio/minio image'ları Docker Hub'dan kaldırıldığı için
  # alpine/minio image'ını kullanıp curl ile S3 API'ye PUT yapıyoruz.
  # ============================================
  minio-init:
    # minio/mc ve minio/minio Docker Hub'dan kaldırıldığı için aws-cli ile S3 API kullanıyoruz.
    image: amazon/aws-cli:2.18.0
    container_name: wirestock-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        ENDPOINT="http://minio:9000"
        BUCKET="${MINIO_BUCKET:-wirestock}"
        export AWS_ACCESS_KEY_ID="${MINIO_ACCESS_KEY:-wirestock}"
        export AWS_SECRET_ACCESS_KEY="${MINIO_SECRET_KEY:-wirestock-secret}"
        export AWS_DEFAULT_REGION="us-east-1"
        # MinIO hazır olana kadar bekle
        for i in $$(seq 1 30); do
          if aws --endpoint-url "$${ENDPOINT}" s3 ls >/dev/null 2>&1; then
            echo "MinIO hazır."
            break
          fi
          echo "MinIO bekleniyor... $$i/30"
          sleep 2
        done
        # Bucket var mı kontrol et, yoksa oluştur
        if aws --endpoint-url "$${ENDPOINT}" s3 ls "s3://$${BUCKET}" >/dev/null 2>&1; then
          echo "Bucket '$${BUCKET}' zaten mevcut."
        else
          echo "Bucket '$${BUCKET}' oluşturuluyor..."
          aws --endpoint-url "$${ENDPOINT}" s3 mb "s3://$${BUCKET}"
          echo "Bucket '$${BUCKET}' oluşturuldu."
        fi
        echo "MinIO init tamamlandı."
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-wirestock}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-wirestock}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-wirestock-secret}
    networks:
      - wirestock-net
    restart: "no"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  wirestock-net:
    driver: bridge
